    "shapr": {
      "Package": "shapr",
      "Version": "1.0.8",
      "Source": "Repository",
      "Title": "Prediction Explanation with Dependence-Aware Shapley Values",
      "Description": "Complex machine learning models are often hard to interpret. However, in many situations it is crucial to understand and explain why a model made a specific prediction. Shapley values is the only method for such prediction explanation framework with a solid theoretical foundation. Previously known methods for estimating the Shapley values do, however, assume feature independence. This package implements methods which accounts for any feature dependence, and thereby produces more accurate estimates of the true Shapley values. An accompanying 'Python' wrapper ('shaprpy') is available through PyPI.",
      "Authors@R": "c( person(\"Martin\", \"Jullum\", email = \"Martin.Jullum@nr.no\", role = c(\"cre\", \"aut\"), comment = c(ORCID = \"0000-0003-3908-5155\")), person(\"Lars Henry Berge\", \"Olsen\", email = \"lhbolsen@nr.no\", role = \"aut\", comment = c(ORCID = \"0009-0006-9360-6993\")), person(\"Annabelle\", \"Redelmeier\", email = \"ardelmeier@gmail.com\", role = \"aut\"), person(\"Jon\", \"Lachmann\", email = \"Jon@lachmann.nu\", role = \"aut\", comment = c(ORCID = \"0000-0001-8396-5673\")), person(\"Nikolai\", \"Sellereite\", email = \"nikolaisellereite@gmail.com\", role = \"aut\", comment = c(ORCID = \"0000-0002-4671-0337\")), person(\"Anders\", \"L<U+00F8>land\", email = \"Anders.Loland@nr.no\", role = \"ctb\"), person(\"Jens Christian\", \"Wahl\", email = \"jens.c.wahl@gmail.com\", role = \"ctb\"), person(\"Camilla\", \"Lingj<U+00E6>rde\", role = \"ctb\"), person(\"Norsk Regnesentral\", role =  c(\"cph\", \"fnd\")) )",
      "URL": "https://norskregnesentral.github.io/shapr/, https://github.com/NorskRegnesentral/shapr/",
