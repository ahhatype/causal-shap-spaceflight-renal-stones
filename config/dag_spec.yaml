# DAG spec for the NASA HSRB Renal Stone Formation risk graph (SA-07566).
#
# Source: NASA's public SA-07566 "Risk of Renal Stone Formation" DAG, supplied
# to Andy Wilson and Lexi Pasi by Robert Reynolds (DAGitty source;
# 53 nodes/83 edges per Robert's version, 51 nodes/75 edges in the prior
# source-aligned reference, Cohen's kappa 0.978 after semantic mapping).
#
# This file holds the 12-node working subgraph scoped down from the full
# 51-node source graph for tractability (docs/methods, Step 2). Graph
# topology is source-aligned to the published NASA DAG. All quantitative
# values here are estimates for training and simulation purposes, informed
# by the literature where available, not empirical NASA effect estimates.
#
# This is a subset and modification of the original DAG, scaled for
# learning purposes; to be extended to the full DAG for the final paper.

outcome: nephrolithiasis
outcome_type: binary   # incidence, sole modeled outcome; logit link throughout.
                        # Mineralized Renal Material / CaOx supersaturation is
                        # an internal mediator node only, not a prediction target.

nodes:
  - id: duration
    label: "Duration"
    type: exposure
    measure: "Cumulative mission days"
    composite: single_measure
    source: "NASA narrative; Gabel et al. 2021 (https://pubmed.ncbi.nlm.nih.gov/33597120/)"

  - id: sex
    label: "Sex"
    type: confounder
    measure: "Male/female"
    composite: single_measure
    note: "Stronger evidence here than for bone: male astronauts and male analog cohorts show greater susceptibility to elevated urinary CaOx supersaturation than females."
    source: "Numerical characterization of astronaut CaOx renal stone risk, npj Microgravity 2022 (https://www.nature.com/articles/s41526-021-00187-z)"

  - id: urinary_calcium_excretion
    label: "Urinary calcium excretion (hypercalciuria)"
    type: mediator
    measure: "24-hr urinary calcium, mg/day"
    composite: single_measure
    note: "Sits on the bone_resorption -> urine_chemistry pathway, making that mechanism explicit as its own node. Grounded thresholds: baseline ~240 mg/day; risk normalizes at <150 mg/day alone, or 190 mg/day combined with fluid intake >=2.5 L/day (interacts with hydration_fluid_intake)."
    source: "Estimated thresholds for training purposes"

  - id: history_of_nephrolithiasis
    label: "Personal/family history of nephrolithiasis"
    type: exogenous_confounder
    measure: "Personal or first/second-degree family history of stone disease (binary)"
    composite: single_measure
    note: "Baseline hypercalciuria/hyperoxaluria tendency is heritable; this stands in for that latent physiology as an exogenous confounder on the urine_chemistry pathway, distinct from vitamin_d_inflight's duration-driven depletion mechanism."
    source: "Family history associated with 2- to 10-fold increased odds of stone disease across cohorts; SKIPOGH population-based cohort, Clin Kidney J 2026 (https://academic.oup.com/ckj/article/19/2/sfag002/8416448); Epidemiology of Stone Disease review (https://pmc.ncbi.nlm.nih.gov/articles/PMC2693870/)"

  - id: vitamin_d_inflight
    label: "Vitamin D (in-flight)"
    type: mediator
    parent: duration
    feeds: urine_chemistry   # via calcium absorption
    measure: "Serum 25(OH)D3, in-flight/post"
    composite: single_measure
    source: "J. Nutrition, Mir cohort (https://jn.nutrition.org/article/S0022-3166(22)10077-5/fulltext) - 32-36% decline during long missions"

  - id: nutrients_risk
    label: "Nutrients (Risk)"
    type: confounder_countermeasure
    measure: "Dietary oxalate, calcium, magnesium intake"
    composite: single_composite
    note: "Broader than bone's calcium-only node, since oxalate/magnesium matter specifically for stone chemistry."
    source: "NASA narrative: Nutrients affect Urine Chemistry through the intake of oxalate, calcium, magnesium"

  - id: bone_formation
    label: "Bone formation"
    type: mediator
    measure: "P1NP, BSAP, osteocalcin"
    composite: pca_composite
    note: "Carried over from the bone track."
    source: "Gabel et al., Sci Adv 2024 (https://www.science.org/doi/10.1126/sciadv.adq3632)"

  - id: bone_resorption
    label: "Bone resorption"
    type: mediator
    strength_note: "Primary driver of this pathway"
    measure: "NTX, CTX"
    composite: pca_composite
    source: "Bone metabolism and renal stone risk during ISS missions, ScienceDirect (https://www.sciencedirect.com/science/article/abs/pii/S8756328215003658)"

  - id: hydration_fluid_intake
    label: "Hydration / fluid intake"
    type: mediator_countermeasure
    measure: "24-hr urine volume and fluid intake, L/day"
    composite: single_measure
    note: "Grounded magnitudes: urine volume >2 L/day reduces risk; in-flight fluid intake ~3.2 L/day needed to reach pre-flight risk level."
    source: "NASA narrative; OCHMO-MTB-003 (https://www.nasa.gov/ochmo-mtb-003-urinary-health-2/); L/day thresholds estimated for training purposes"

  - id: urine_chemistry
    label: "Urine Chemistry"
    type: mediator
    measure: "PCA composite: calcium, citrate, oxalate, pH"
    composite: pca_composite
    note: "Full monitoring panel: calcium oxalate, uric acid, citrate, pH, sodium, sulfate, phosphorus, magnesium, potassium."
    source: "NASA narrative and OCHMO-MTB-003"

  - id: mineralized_renal_material
    label: "Mineralized Renal Material (CaOx supersaturation)"
    type: mediator
    measure: "Relative supersaturation (RSS) score"
    composite: single_measure
    note: "25% of astronauts show elevated CaOx supersaturation pre-flight vs. 46% post-flight. Internal mediator, not a modeled outcome."
    source: "Goodenow et al., npj Microgravity 2022 (https://www.nature.com/articles/s41526-021-00187-z)"

  - id: nephrolithiasis
    label: "Nephrolithiasis"
    type: outcome
    measure: "Kidney stone presence/incidence"
    composite: single_measure
    note: "2nd most likely reason for ISS emergency medical evacuation per NASA's Integrated Medical Model. Sole modeled outcome."
    source: "NASA narrative and Andy's repo confirm as target; OCHMO-MTB-003"

# Directed edges. magnitude/direction fields mirror docs/methods section 3.
# status flags:
#   confirmed_mechanism  - stated directly in the NASA narrative
#   magnitude_estimate    - literature-informed estimate, for training purposes
#   directional_only      - direction estimated, no magnitude assigned
edges:
  - from: duration
    to: bone_resorption
    status: magnitude_estimate
    magnitude_note: "~2x baseline resorption markers, sustained through 6-month missions (carried over from bone track, same mechanism)"
    source: "Gabel et al. preprint (https://www.researchgate.net/publication/387274968_...)"

  - from: duration
    to: bone_formation
    status: magnitude_estimate
    magnitude_note: "Near-zero to mildly decreased"
    source: "Smith, NASA NTRS review (https://ntrs.nasa.gov/api/citations/20100030546/downloads/20100030546.pdf)"

  - from: bone_formation
    to: urine_chemistry
    status: magnitude_estimate
    magnitude_note: "Deliberate near-null distractor edge: intentionally near-zero true effect, used to test whether SHAP methods over-attribute importance to a feature with almost no downstream effect."
    source: "Repo design choice: deliberate near-null distractor edge, estimated for training purposes"

  - from: bone_resorption
    to: urinary_calcium_excretion
    status: directional_only
    magnitude_note: "Bone resorption elevates urinary calcium"
    source: "Bone metabolism and renal stone risk, ISS missions (https://www.sciencedirect.com/science/article/abs/pii/S8756328215003658)"

  - from: urinary_calcium_excretion
    to: urine_chemistry
    status: magnitude_estimate
    magnitude_note: "Grounded threshold: baseline ~240 mg/day urinary calcium. Main effect only - the combined-threshold finding (risk normalizes at <150 mg/day alone, or 190 mg/day combined with fluid intake >=2.5 L/day) is represented separately below as an interaction term on urinary_calcium_excretion -> mineralized_renal_material."
    source: "Estimated for training purposes"

  - from: urinary_calcium_excretion
    to: mineralized_renal_material
    interacts_with: hydration_fluid_intake
    status: magnitude_estimate
    magnitude_note: "Interaction-only edge, additive on top of the main-effect edges urinary_calcium_excretion -> urine_chemistry and hydration_fluid_intake -> mineralized_renal_material: the combined-threshold finding where 190 mg/day urinary calcium and >=2.5 L/day fluid intake together normalize risk. Functional form: multiplicative effect-modification (product of the two nodes' standardized values)."
    source: "Estimated for training purposes"

  - from: duration
    to: mineralized_renal_material
    status: magnitude_estimate
    magnitude_note: "Prevalence of elevated CaOx supersaturation: 25% pre-flight to 46% post-flight"
    source: "Goodenow et al., npj Microgravity 2022"

  - from: sex
    to: mineralized_renal_material
    status: directional_only
    magnitude_note: "Males more susceptible to elevated CaOx supersaturation than females; astronaut cohorts are heavily male-skewed, limiting power"
    source: "Goodenow et al."

  - from: hydration_fluid_intake
    to: urine_chemistry
    status: magnitude_estimate
    magnitude_note: "Grounded: urine volume >2 L/day reduces risk"
    source: "NASA narrative; OCHMO-MTB-003"

  - from: hydration_fluid_intake
    to: mineralized_renal_material
    status: magnitude_estimate
    magnitude_note: "Grounded: in-flight fluid intake ~3.2 L/day needed to reach pre-flight risk level"
    source: "NASA narrative; OCHMO-MTB-003"

  - from: history_of_nephrolithiasis
    to: urine_chemistry
    status: magnitude_estimate
    magnitude_note: "General (non-spaceflight) literature: family history associated with >2.5x increased odds of stone disease (one cohort reports OR 9.96), via baseline hypercalciuria/hyperoxaluria tendency. Wide range across studies - flag for domain review."
    source: "SKIPOGH cohort (PMC12902508); Epidemiology of Stone Disease review (PMC2693870)"

  - from: vitamin_d_inflight
    to: urine_chemistry
    status: directional_only
    magnitude_note: "Duration-driven serum vitamin D depletion reduces intestinal calcium absorption, via calcium absorption"
    source: "J. Nutrition, Mir cohort"

  - from: nutrients_risk
    to: urine_chemistry
    status: directional_only
    magnitude_note: "NASA narrative names the pathway (oxalate, calcium, magnesium intake) without a magnitude"
    source: "NASA narrative"

  - from: duration
    to: vitamin_d_inflight
    status: confirmed_mechanism
    magnitude_note: "In-flight vitamin D is a mediator, child of Duration"

  - from: urine_chemistry
    to: mineralized_renal_material
    status: confirmed_mechanism
    magnitude_note: "Urine Chemistry determines whether Mineralized Renal Material precipitates"
    source: "NASA narrative (direct basis)"

  - from: mineralized_renal_material
    to: nephrolithiasis
    status: confirmed_mechanism
    magnitude_note: "Mineralized Renal Material determines Nephrolithiasis risk"
    source: "NASA narrative (direct basis)"

# Note on Astronaut Selection: the NASA narrative names it directly
# ("individuals with a high risk of renal stones would not be selected into
# the Astronaut Corps"). This is a selection mechanism, not a DAG node -
# it belongs in Step 10's sampling constraints, not in this node/edge list.
selection_mechanisms:
  - id: astronaut_selection
    note: "Selects against high renal-stone risk at cohort entry. Applied during data generation and stressed in Step 10, not represented as a DAG node."
    source: "NASA narrative"

  - id: era_countermeasure_range
    note: "Era / countermeasure protocol (pre/post ARED, KCit availability) is modeled as a Step 10 sampling axis (widened mission-era range) rather than a causal graph node: its exercise-countermeasure effect on renal stone risk is documented as marginal, unlike its strong effect on bone."
    source: "NASA narrative; Goodenow et al."
