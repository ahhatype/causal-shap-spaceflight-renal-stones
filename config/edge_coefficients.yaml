# Structural-equation coefficients for Step 3 (simcausal data generation).
#
# These are the numeric estimates that r/R/simcausal_helpers.R turns into
# structural equations. They translate the qualitative evidence in
# config/dag_spec.yaml into a starting-point number so simulation can run.
# Every value here is an estimate for training and simulation purposes, not
# an empirical NASA effect estimate.
#
# Edge identifiers (from/to) match config/dag_spec.yaml.

purpose: training estimates

sample_size:
  default: 1000        # order of magnitude of the real astronaut cohort
  note: "Larger generated samples available where estimator stability requires them."

# All continuous nodes except the two raw-unit root nodes noted in
# root_node_distributions (duration, hydration_fluid_intake) are generated
# directly on a standardized (mean 0, SD 1) scale, so every coefficient in
# `coefficients` below is a standardized path coefficient. duration and
# hydration_fluid_intake are given real-world units for interpretability but
# must be z-scored before their outgoing coefficients are applied. sex and
# history_of_nephrolithiasis are binary, kept in raw 0/1 form in their own
# column, but mean-centered (not scaled) wherever they enter another node's
# formula, so a binary parent's own marginal prevalence doesn't shift a
# downstream standardized node's mean away from 0. nephrolithiasis is the
# sole outcome, binary, logit link - see outcome_calibration.
standardization_convention: >
  Every continuous node other than duration and hydration_fluid_intake is
  simulated directly on a standardized mean-0/SD-1 scale. duration and
  hydration_fluid_intake are simulated in real-world units (days, L/day)
  for interpretability and must be z-scored before applying their outgoing
  path coefficients. sex and history_of_nephrolithiasis are binary
  indicators, kept in their raw 0/1 form as their own column, but
  mean-centered (subtract their root-node probability, not divided by SD)
  wherever they enter another node's formula as a predictor, so their own
  marginal prevalence doesn't shift a downstream standardized node's mean
  away from 0.

coefficients:
  - from: duration
    to: bone_resorption
    coefficient: 0.60
    direction_only: false
    magnitude_basis: "Strong (~2x baseline resorption markers)."

  - from: duration
    to: bone_formation
    coefficient: -0.10
    direction_only: false
    magnitude_basis: "Near-null/mildly decreased. Kept deliberately near-zero: bone_formation is a distractor node in this graph (see its outgoing edge below), not a strong pathway."

  - from: bone_formation
    to: urine_chemistry
    coefficient: 0.05
    direction_only: false
    magnitude_basis: "Intentional near-null distractor edge: tests whether SHAP methods over-attribute importance to a feature with almost no true downstream effect, given bone_formation is included in the model alongside its near-zero true effect."

  - from: bone_resorption
    to: urinary_calcium_excretion
    coefficient: 0.60
    direction_only: false
    magnitude_basis: "Hypercalciuria described in the literature as the most important aggravating factor in this pathway."

  - from: urinary_calcium_excretion
    to: urine_chemistry
    coefficient: 0.50
    direction_only: false
    magnitude_basis: "The 150/190/240 mg/day thresholds motivate a moderate-to-strong main effect. Main effect only - the combined threshold with hydration_fluid_intake is captured separately as an interaction term, see below."

  - from: urinary_calcium_excretion
    to: nephrolithiasis
    interacts_with: hydration_fluid_intake
    coefficient: 0.135   # 0.15 x 0.90, see this file's note on the collapsed Mineralized Renal Material intermediate below
    direction_only: false
    functional_form: multiplicative   # product of the two nodes' standardized values, added on top of their separate main-effect edges
    magnitude_basis: "Combined-threshold finding: risk normalizes at <150 mg/day urinary calcium alone, or 190 mg/day combined with fluid intake >=2.5 L/day - i.e. hydration modifies the calcium effect."
    note: "Interaction-only term, additive on top of the main-effect edges urinary_calcium_excretion -> urine_chemistry and hydration_fluid_intake -> nephrolithiasis, not a replacement for either."

  - from: duration
    to: nephrolithiasis
    coefficient: 0.36   # 0.40 x 0.90, see this file's note on the collapsed Mineralized Renal Material intermediate below
    direction_only: false
    magnitude_basis: "Prevalence shift 25% pre-flight to 46% post-flight elevated CaOx supersaturation. Modeled as a partial direct effect; the remainder of duration's total effect on this outcome is mediated through bone_resorption -> urinary_calcium_excretion -> urine_chemistry and through vitamin_d_inflight."

  - from: sex
    to: nephrolithiasis
    coefficient: 0.18   # 0.20 x 0.90, see this file's note on the collapsed Mineralized Renal Material intermediate below
    direction_only: false
    magnitude_basis: "Males (coded male=1) more susceptible to elevated CaOx supersaturation; astronaut cohorts are heavily male-skewed, limiting power. Kept deliberately small."

  - from: hydration_fluid_intake
    to: urine_chemistry
    coefficient: -0.40
    direction_only: false
    magnitude_basis: "Urine volume >2 L/day reduces risk via dilution. Protective (negative) effect."

  - from: hydration_fluid_intake
    to: nephrolithiasis
    coefficient: -0.27   # -0.30 x 0.90, see this file's note on the collapsed Mineralized Renal Material intermediate below
    direction_only: false
    magnitude_basis: "In-flight fluid intake ~3.2 L/day needed to reach pre-flight risk level. Protective (negative) effect."

  - from: history_of_nephrolithiasis
    to: urine_chemistry
    coefficient: 0.92   # log(2.5), the conservative end of the non-spaceflight epidemiology range
    direction_only: false
    magnitude_basis: "OR ~2.5 for stone disease with family history, non-spaceflight literature (individual cohorts report up to ~10x); via baseline hypercalciuria/hyperoxaluria tendency. Binary indicator (present=1), used directly like sex, not standardized."

  - from: vitamin_d_inflight
    to: urine_chemistry
    coefficient: 0.30
    direction_only: false
    magnitude_basis: "Calcium-absorption mechanism, driven by duration-linked serum vitamin D depletion (see duration -> vitamin_d_inflight below)."

  - from: nutrients_risk
    to: urine_chemistry
    coefficient: 0.30
    direction_only: false
    magnitude_basis: "NASA narrative names the pathway (oxalate, calcium, magnesium intake) without a magnitude."

  - from: duration
    to: vitamin_d_inflight
    coefficient: -0.34  # 32-36% decline during long missions
    direction_only: false
    magnitude_basis: "32-36% decline in serum 25(OH)D3 during long missions (Mir cohort)."

  - from: urine_chemistry
    to: nephrolithiasis
    coefficient: 0.63   # 0.70 x 0.90, see the note directly below
    direction_only: false
    magnitude_basis: "Core precipitation step of the mechanism (confirmed_mechanism in dag_spec.yaml); given the strongest standardized coefficient among nephrolithiasis's direct edges accordingly. Coefficient is on the log-odds (logit) scale, since nephrolithiasis is a binary outcome with a logit link - see outcome_calibration for how the intercept is set alongside it."
    note: "config/dag_spec.yaml collapses two NASA-confirmed mechanisms in sequence - urine_chemistry -> Mineralized Renal Material (originally 0.70) and Mineralized Renal Material -> nephrolithiasis (originally 0.90, logit scale) - into this single direct edge. Every coefficient elsewhere in this file that used to target Mineralized Renal Material is likewise scaled by that collapsed 0.90 (marked individually where it applies): duration 0.40->0.36, sex 0.20->0.18, hydration_fluid_intake -0.30->-0.27, the urinary_calcium_excretion x hydration_fluid_intake interaction 0.15->0.135, and this edge 0.70->0.63. This scaling is exact for the path-coefficient terms - a linear combination multiplied by a constant scales every term by that constant - but Mineralized Renal Material's own residual/noise variance (its empirical_residual_sd, see r/R/simcausal_helpers.R) no longer contributes a separate source of stochasticity to nephrolithiasis once collapsed; nephrolithiasis's own Bernoulli draw is the only randomness left on this pathway, which is a genuine (if secondary) simplification worth flagging alongside the training-purposes caveat on every other value in this file."

# Marginal distributions for the five exogenous/root nodes (no incoming
# edges): duration, sex, history_of_nephrolithiasis, nutrients_risk,
# hydration_fluid_intake.
#
# Machine-readable: distr is the simcausal distribution function name
# (rnorm_trunc / rnorm_trunc2 are custom, defined in
# r/R/simcausal_helpers.R; rbern/rnorm are simcausal built-ins), params is
# spliced directly into node()'s arguments. unit's presence marks a node as
# raw-scale (needs z-scoring before its outgoing path coefficients apply,
# per standardization_convention above) - its absence means the node is
# already on the standardized scale.
root_node_distributions:
  - node: duration
    distr: rnorm_trunc2
    params: {mean: 180, sd: 45, minval: 14, maxval: 365}
    unit: days
    basis: "ISS long-duration missions run approximately 6 months"

  - node: sex
    distr: rbern
    params: {prob: 0.80}
    basis: "Astronaut corps is heavily male-skewed"
    note: "Coded male=1 in its own column. Mean-centered (subtract 0.80), not scaled by SD, wherever it enters a downstream node's formula, per standardization_convention."

  - node: history_of_nephrolithiasis
    distr: rbern
    params: {prob: 0.25}
    basis: "Approximate general-population prevalence of a personal or first/second-degree family history of stone disease."
    note: "Coded present=1 in its own column. Mean-centered (subtract 0.25), not scaled by SD, wherever it enters a downstream node's formula, same convention as sex."

  - node: nutrients_risk
    distr: rnorm
    params: {mean: 0, sd: 1}
    basis: "Composite dietary oxalate/calcium/magnesium intake index; no natural raw unit, modeled directly as a standardized latent."

  - node: hydration_fluid_intake
    distr: rnorm_trunc
    params: {mean: 2.3, sd: 0.4, minval: 0}
    unit: L/day
    basis: "Operational fluid-intake prescription of approximately 2.0-2.5 L/day"
    note: "Raw units (L/day) for interpretability; z-score before applying hydration_fluid_intake's outgoing path coefficients, per standardization_convention."

# bone_formation, bone_resorption, and urine_chemistry are declared
# composite: pca_composite in dag_spec.yaml (each stands in for multiple
# constituent biomarkers). Simulated directly as a single latent standardized
# continuous variable rather than simulating the constituent biomarkers and
# running PCA inside the simulation, since the composite - not its
# constituent biomarkers - is what enters the SHAP models being compared, and
# the latent avoids having to specify a full biomarker covariance structure
# that nothing downstream needs.
composite_node_parameterization:
  applies_to: [bone_formation, bone_resorption, urine_chemistry]
  decision: "Simulate directly as a single latent standardized (mean 0, total variance 1) continuous variable."
  residual_rule: "Each node's residual/noise SD is set so its total variance equals 1 given the contribution of its incoming edges."

# nephrolithiasis is the sole outcome (binary, logit link - see
# outcome_type in dag_spec.yaml). The intercept is a free parameter not
# implied by any of the path coefficients above and must be set separately.
outcome_calibration:
  node: nephrolithiasis
  link: logit
  target_marginal_prevalence: 0.10
  basis: "Intercept set so P(nephrolithiasis=1) is approximately 0.10 in the default clean simulation regime (n=1000), yielding roughly 100 positive cases for estimator stability. This is a deliberate upward inflation relative to true astronaut kidney-stone incidence, chosen for tractability, not a claim about the real population rate - flag explicitly wherever prevalence is reported."
