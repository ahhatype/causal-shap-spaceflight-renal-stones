name: Render archived presentation
# ADR 010: local/provenance build only. No automatic Pages deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render site
      - uses: actions/upload-artifact@v4
        with:
          name: archived-presentation
          path: site/_site
          retention-days: 7
