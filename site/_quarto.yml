project:
  type: website
  output-dir: _site
  pre-render:
    - python build_resources.py
  resources:
    - resources/**
    - assets/two-goals.svg
  render:
    - index.qmd
    - target-dags.qmd

execute:
  freeze: true

website:
  title: "Space SHAP"
  description: "A prediction ranking need not tell us where to intervene. A causal tutorial with evidence from a NASA-topology simulation."
  site-url: https://andystats.github.io/causal-shap-target-dags/
  favicon: favicon.svg
  search: false
  page-navigation: false
  navbar:
    background: light
    collapse: true
    left:
      - text: "The example"
        href: index.qmd#goals
      - text: "Central workflow"
        href: index.qmd#path
      - text: "Worked calculation"
        href: index.qmd#worked-example
      - text: "Evidence"
        href: index.qmd#evidence
      - text: "Educators"
        href: index.qmd#educators
      - text: "Open questions"
        href: index.qmd#claims
    right:
      - icon: github
        aria-label: "GitHub repository"
        href: https://github.com/ahhatype/causal-shap-spaceflight-renal-stones
  page-footer:
    left: "Space SHAP"
    right:
      - text: "Original ACIC project"
        href: https://www.tao-rwd.com/acic-2026/causal-shap
      - text: "Target DAGs page (archive)"
        href: target-dags.qmd
      - text: "Research record"
        href: https://github.com/ahhatype/causal-shap-spaceflight-renal-stones/tree/main/docs

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    grid:
      body-width: 1180px
      gutter-width: 1.5rem
