project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - target-dags.qmd

execute:
  freeze: true

website:
  title: "Space SHAP"
  description: "Your roadmap should follow your goal. Prediction and intervention are different goals with different recipes; a seven-step path from data to an intervention target, tested on NASA's renal-stone topology."
  site-url: https://andystats.github.io/causal-shap-target-dags/
  favicon: favicon.svg
  search: false
  page-navigation: false
  navbar:
    background: light
    collapse: true
    left:
      - text: "Two goals"
        href: index.qmd#goals
      - text: "The path"
        href: index.qmd#path
      - text: "Depth"
        href: index.qmd#depth
      - text: "Evidence"
        href: index.qmd#evidence
      - text: "Claims"
        href: index.qmd#claims
      - text: "Archive"
        href: target-dags.qmd
    right:
      - icon: github
        aria-label: "GitHub repository"
        href: https://github.com/ahhatype/causal-shap-spaceflight-renal-stones
  page-footer:
    left: "Space SHAP · companion to an npj Microgravity article"
    right:
      - text: "Original ACIC project"
        href: https://www.tao-rwd.com/acic-2026/causal-shap
      - text: "Target DAGs page (archive)"
        href: target-dags.qmd
      - text: "Research record"
        href: https://github.com/ahhatype/causal-shap-spaceflight-renal-stones/tree/main/docs

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    grid:
      body-width: 1180px
      gutter-width: 1.5rem
